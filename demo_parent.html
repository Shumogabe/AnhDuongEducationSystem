      /* ===== ĐÓN TRẢ ===== */

        };

          ${card("Cân nặng (kg)", line(1, "#8E2424"))}
          ${card("Chiều cao (cm)", line(2, "#2E7D32"))}
          <p class="text-xs text-gray-500">Chỉ số do y tế nhà trường đo theo kỳ. Đánh giá theo chuẩn WHO do cô y tế thực hiện. Nếu có băn khoăn, hãy nhắn cô chủ nhiệm.</p>`;
      }

      /* ===== THỰC ĐƠN, THÔNG BÁO ===== */
      const coastal = (k) => /Nha Trang|Quy Nhơn/.test(KIDS[k].campus);
      function menuFor(k, dayIdx) { const m = MENU[dayIdx].slice(); if (coastal(k)) m[0] = COASTAL_BREAKFAST[dayIdx]; return m; }
      let menuDay = Math.min(Math.max(dowOf(TODAY) - 1, 0), 4);
      function pgMenu() {
        const m = menuFor(kid, menuDay);
        return `${backBar("more", "Thực đơn tuần")}
          <p class="text-xs text-gray-500">${e(kidInfo().campus)}</p>
          <div class="flex gap-2 overflow-x-auto no-scrollbar" role="tablist">${["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6"].map((d, i) => `<button role="tab" aria-selected="${i === menuDay}" onclick="menuDay=${i};route()" class="tab-btn ${i === menuDay ? "active" : ""}">${d}</button>`).join("")}</div>
          ${card("", ["Bữa sáng", "Bữa trưa", "Bữa chiều"].map((l, i) => `<div class="py-2 border-b border-gray-100 last:border-0"><p class="text-xs text-gray-500">${l}</p><p class="text-sm font-semibold">${e(m[i])}</p></div>`).join(""))}
          ${ALLERGIES[kid].length ? lockNote("Bé " + e(kidInfo().name.replace("Bé ", "")) + " có khai báo dị ứng: " + e(ALLERGIES[kid].join(", ")) + ". Nhà bếp sẽ điều chỉnh khẩu phần riêng.").replace("fa-lock", "fa-triangle-exclamation") : ""}`;
      }
      function pgNotices() {
        return `${backBar("home", "Thông báo")}
          <div class="space-y-2">${NOTICES.map((n) => `<button onclick="navigate('notice','${n.id}')" class="tap w-full text-left bg-white rounded-2xl border ${n.read ? "border-gray-100" : "border-brand-tint3"} shadow-sm p-4 flex gap-3"><span class="w-2.5 h-2.5 mt-1.5 rounded-full ${n.read ? "bg-gray-200" : "bg-brand-primary"} shrink-0"></span><span class="flex-1"><span class="block text-sm ${n.read ? "font-medium" : "font-bold"} leading-snug">${e(n.title)}</span><span class="text-xs text-gray-500">${e(n.scope)} · ${fmtDate(n.date)}</span></span></button>`).join("")}</div>`;
      }
      function pgNotice(id) {
        const n = NOTICES.find((x) => String(x.id) === id);
        if (!n) return false;
        n.read = true;
        renderHeader();
        return `${backBar("notices", "Thông báo")}${card("", `<div class="space-y-2">${badge(n.scope, "bg-brand-tint2 text-brand-primary")}<h2 class="font-bold text-base leading-snug">${e(n.title)}</h2><p class="text-xs text-gray-500">${fmtDate(n.date)}</p><p class="text-sm leading-relaxed pt-2">${e(n.body)}</p></div>`)}`;
      }

      /* ===== TIN NHẮN ===== */
      function inWorkHours() { const d = new Date(), w = d.getDay(), h = d.getHours(); return w >= 1 && w <= 5 && h >= 7 && h < 17; }
      function pgChat() {
        const k = kidInfo();
        const ok = inWorkHours();
        const msgs = CHATS[kid];
        return `<div class="flex flex-col" style="min-height:calc(100vh - 11rem)">
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3 flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-brand-tint2 text-brand-primary flex items-center justify-center"><i class="fa-solid fa-chalkboard-user"></i></span><span class="flex-1"><span class="block text-sm font-bold">${e(k.teacher)}</span><span class="text-xs text-gray-500">GVCN lớp ${e(k.cls)}</span></span><span class="text-xs font-semibold ${ok ? "text-brand-green" : "text-gray-400"}"><i class="fa-solid fa-circle text-[8px] mr-1"></i>${ok ? "Trong giờ làm việc" : "Ngoài giờ"}</span></div>
          <p class="text-xs text-gray-500 text-center my-3">Giờ làm việc 7:00 - 17:00, thứ 2 đến thứ 6. Ngoài giờ cô sẽ trả lời vào buổi sáng làm việc kế tiếp. Ban giám hiệu có thể xem nội dung trò chuyện.</p>
          <div id="chat-list" class="flex-1 space-y-2 pb-3">${msgs.length ? msgs.map((m) => `<div class="flex ${m.from === "me" ? "justify-end" : "justify-start"}"><div class="max-w-[80%] px-3.5 py-2 rounded-2xl text-sm ${m.from === "me" ? "bg-brand-primary text-white rounded-br-md" : "bg-white border border-gray-100 rounded-bl-md"}">${e(m.text)}<div class="text-[10px] mt-1 ${m.from === "me" ? "text-white/70" : "text-gray-400"}">${m.t.slice(11)}</div></div></div>`).join("") : empty("fa-comments", "Chưa có tin nhắn. Hãy chào cô nhé!")}</div>
          <form onsubmit="sendChat(event)" class="sticky bottom-20 flex gap-2 bg-brand-cream pt-2"><input id="chat-in" class="fld" placeholder="Nhắn cô ${e(k.teacher.replace("Cô ", ""))}..." maxlength="500" aria-label="Nội dung tin nhắn" autocomplete="off" /><button class="tap w-12 rounded-full bg-brand-primary text-white" aria-label="Gửi"><i class="fa-solid fa-paper-plane"></i></button></form></div>`;
      }
      function sendChat(ev) {
        ev.preventDefault();
        const input = $("chat-in");
        const text = input.value.trim();
        if (!text) return;
        const now = new Date(); const p = (n) => String(n).padStart(2, "0");
        const t = `${TODAY} ${p(now.getHours())}:${p(now.getMinutes())}`;
        CHATS[kid].push({ from: "me", text, t });
        const ok = inWorkHours(), k = kid;
        route();
        setTimeout(() => {
          CHATS[k].push({ from: "teacher", text: ok ? "Dạ cô đã nhận tin nhắn, cô sẽ phản hồi ngay ạ." : "Hiện đã ngoài giờ làm việc. Cô sẽ trả lời bạn vào sáng làm việc kế tiếp ạ.", t });
          if (location.hash === "#/chat" && kid === k) route();
        }, 1200);
      }

      /* ===== HỌC PHÍ ===== */
      function pgFees() {
        if (!isMain()) return `${backBar("more", "Học phí")}${lockNote("Chỉ Phụ huynh chính được xem học phí và biên lai.")}`;
        const list = FEES[kid];
        const due = list.filter((f) => f.status !== "Đã đóng");
        const paid = list.filter((f) => f.status === "Đã đóng");
        const total = due.reduce((s, f) => s + f.amount, 0);
        const row = (f) => `<button onclick="navigate('fee','${f.id}')" class="tap w-full text-left flex items-center gap-3 py-2.5 border-b border-gray-100 last:border-0"><span class="flex-1"><span class="block text-sm font-semibold">${e(f.title)}</span><span class="text-xs text-gray-500">${f.status === "Đã đóng" ? "Đóng ngày " + fmtDate(f.paidDate) : "Hạn " + fmtDate(f.due)}</span></span><span class="text-right"><span class="block text-sm font-bold">${money(f.amount)}</span>${badge(f.status, FEE_TONE[f.status])}</span></button>`;
        return `${backBar("more", "Học phí")}
          <div class="bg-brand-primary text-white rounded-2xl p-5"><p class="text-xs text-white/80">Cần đóng của ${e(kidInfo().name)}</p><p class="text-3xl font-bold mt-1">${money(total)}</p><p class="text-xs text-white/80 mt-1">${due.length ? due.length + " khoản" + (due.some((f) => f.status === "Quá hạn") ? ", có khoản quá hạn" : "") : "Đã thanh toán đủ"}</p></div>
          <div class="flex gap-2 text-xs bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-xl p-3"><i class="fa-solid fa-circle-info mt-0.5"></i><p>Thanh toán trong app <strong>chưa được hỗ trợ</strong>. Nút Thanh toán chỉ minh họa giao diện; vui lòng đóng tại trường hoặc theo hướng dẫn của nhà trường.</p></div>
          ${card("Khoản phải đóng", due.length ? due.map(row).join("") : empty("fa-circle-check", "Không có khoản nào cần đóng."))}
          ${card("Đã đóng", paid.length ? paid.map(row).join("") : empty("fa-receipt", "Chưa có khoản nào."))}`;
      }
      function pgFee(id) {
        if (!isMain()) return `${backBar("more", "Học phí")}${lockNote("Chỉ Phụ huynh chính được xem học phí và biên lai.")}`;
        const f = FEES[kid].find((x) => String(x.id) === id);
        if (!f) return false;
        return `${backBar("fees", "Chi tiết khoản")}
          ${card("", `<div class="space-y-3"><div class="flex justify-between items-start gap-2"><h2 class="font-bold text-base leading-snug">${e(f.title)}</h2>${badge(f.status, FEE_TONE[f.status])}</div><p class="text-3xl font-bold text-brand-primary">${money(f.amount)}</p><dl class="text-sm space-y-1.5"><div class="flex justify-between"><dt class="text-gray-500">Loại khoản</dt><dd>${e(f.type)}</dd></div><div class="flex justify-between"><dt class="text-gray-500">Hạn đóng</dt><dd>${fmtDate(f.due)}</dd></div><div class="flex justify-between"><dt class="text-gray-500">Bé</dt><dd>${e(kidInfo().name)}</dd></div>${f.status === "Đã đóng" ? `<div class="flex justify-between"><dt class="text-gray-500">Ngày đóng</dt><dd>${fmtDate(f.paidDate)}</dd></div>` : ""}</dl></div>`)}
          ${f.status === "Đã đóng" ? btn("Xem biên lai " + e(f.receipt), `openReceipt(${f.id})`, "primary", "fa-receipt") : btn("Thanh toán", `openPay(${f.id})`, "primary", "fa-wallet")}`;
      }
      function openPay(id) {
        const f = FEES[kid].find((x) => x.id === id);
        openModal("Thanh toán (mô phỏng)", `<div class="flex gap-2 text-xs bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-xl p-3"><i class="fa-solid fa-triangle-exclamation mt-0.5"></i><p>Chưa hỗ trợ thanh toán trong app. Giao diện chỉ để minh họa; không có khoản tiền nào được ghi nhận.</p></div><p class="text-sm">Số tiền: <strong>${money(f.amount)}</strong></p><div class="space-y-2">${[["fa-qrcode", "Quét mã QR ngân hàng"], ["fa-credit-card", "VNPay"], ["fa-mobile-screen", "Momo"]].map((m) => `<button onclick="toast('Chưa hỗ trợ thanh toán trong app (mô phỏng)')" class="tap w-full flex items-center gap-3 p-3 rounded-2xl border border-gray-200 text-left"><i class="fa-solid ${m[0]} text-brand-primary w-6 text-center"></i><span class="text-sm font-semibold">${m[1]}</span></button>`).join("")}</div>`);
      }
      function openReceipt(id) {
        const f = FEES[kid].find((x) => x.id === id);
        openModal("Biên lai " + f.receipt, `<div class="border border-dashed border-gray-300 rounded-2xl p-4 space-y-3 text-sm"><div class="text-center"><p class="font-bold text-brand-primary">HỆ THỐNG GIÁO DỤC MẦM NON ÁNH DƯƠNG</p><p class="text-xs text-gray-500">${e(kidInfo().campus)}</p></div><p class="text-center font-bold">BIÊN LAI THU TIỀN</p><dl class="space-y-1.5"><div class="flex justify-between"><dt class="text-gray-500">Số</dt><dd>${e(f.receipt)}</dd></div><div class="flex justify-between"><dt class="text-gray-500">Ngày</dt><dd>${fmtDate(f.paidDate)}</dd></div><div class="flex justify-between"><dt class="text-gray-500">Học sinh</dt><dd>${e(kidInfo().name)} (${e(kidInfo().cls)})</dd></div><div class="flex justify-between"><dt class="text-gray-500">Nội dung</dt><dd class="text-right">${e(f.title)}</dd></div><div class="flex justify-between font-bold"><dt>Số tiền</dt><dd>${money(f.amount)}</dd></div></dl><p class="text-xs text-gray-500">Biên lai nội bộ do nhà trường xuất, không phải hóa đơn VAT.</p></div><div class="flex gap-2">${btn("Tải PDF", "toast('Đã tải biên lai (demo)')", "primary", "fa-download")}${btn("Đóng", "closeModal()")}</div>`);
      }

      /* ===== THÊM / HỒ SƠ ===== */
      function pgMore() {
        const row = (icon, tone, title, to, extra) => `<button onclick="${to}" class="tap w-full bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center gap-3 text-left"><span class="w-10 h-10 rounded-xl ${tone} flex items-center justify-center"><i class="fa-solid ${icon}"></i></span><span class="flex-1 text-sm font-semibold">${title}</span>${extra || ""}<i class="fa-solid fa-chevron-right text-gray-400"></i></button>`;
        const unread = NOTICES.filter((n) => !n.read).length;
        return `<h1 class="font-bold text-base">Thêm</h1>
          <div class="space-y-2">
            ${row("fa-heart-pulse", "bg-green-100 text-brand-green", "Sức khỏe", "navigate('health')")}
            ${row("fa-utensils", "bg-yellow-100 text-brand-gold", "Thực đơn tuần", "navigate('menu')")}
            ${row("fa-bell", "bg-blue-100 text-brand-blue", "Thông báo", "navigate('notices')", unread ? badge(unread + " mới", "bg-brand-primary text-white") : "")}
            ${row("fa-wallet", "bg-brand-tint2 text-brand-primary", "Học phí", "navigate('fees')", isMain() ? "" : '<i class="fa-solid fa-lock text-gray-400 mr-2"></i>')}
            ${row("fa-user", "bg-gray-100 text-gray-600", "Hồ sơ bé và cài đặt", "navigate('profile')")}
            ${row("fa-phone", "bg-green-100 text-brand-green", "Liên hệ nhà trường", "contactSchool()")}
          </div>
          ${btn("Đăng xuất", "logout()", "danger", "fa-right-from-bracket")}
          <p class="text-center text-xs text-gray-400">Ánh Dương Phụ huynh · bản demo</p>`;
      }
      function contactSchool() {
        const k = kidInfo();
        openModal("Liên hệ nhà trường", `<p class="text-sm font-semibold">${e(k.campus)}</p><div class="space-y-2">${btn("Gọi hotline " + e(k.hotline), "location.href='tel:0965284866'", "green", "fa-phone")}<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(k.campus)}" target="_blank" rel="noopener" class="tap flex items-center justify-center gap-2 px-4 rounded-full text-xs font-semibold border border-brand-tint3 text-brand-primary"><i class="fa-solid fa-diamond-turn-right"></i>Chỉ đường</a></div>`);
      }
      function pgProfile() {
        const k = kidInfo();
        const rel = [["Nguyễn Thị Hoa", "Phụ huynh chính", "0905123456"], ...(kid === "bin" ? [["Nguyễn Văn Bà", "Người thân (xem, đón bé)", "0912345678"]] : [])];
        return `${backBar("more", "Hồ sơ & cài đặt")}
          ${card("Hồ sơ " + e(k.name), `<dl class="text-sm space-y-1.5"><div class="flex justify-between"><dt class="text-gray-500">Lớp</dt><dd>${e(k.cls)}</dd></div><div class="flex justify-between"><dt class="text-gray-500">Cơ sở</dt><dd class="text-right">${e(k.campus)}</dd></div><div class="flex justify-between"><dt class="text-gray-500">Ngày sinh</dt><dd>${k.dob}</dd></div><div class="flex justify-between"><dt class="text-gray-500">GV chủ nhiệm</dt><dd>${e(k.teacher)}</dd></div></dl><p class="text-xs text-gray-500">Thông tin do nhà trường quản lý. Cần sửa, vui lòng liên hệ nhà trường.</p>`)}
          ${card("Người thân có quyền xem bé", rel.map((r) => `<div class="flex items-center gap-3 py-1.5"><span class="w-9 h-9 rounded-full bg-brand-tint2 text-brand-primary flex items-center justify-center"><i class="fa-solid fa-user"></i></span><span class="flex-1"><span class="block text-sm font-semibold">${r[0]}</span><span class="text-xs text-gray-500">${r[1]} · ${r[2]}</span></span></div>`).join(""), isMain() ? `<button onclick="inviteRelative()" class="text-xs text-brand-primary font-semibold">Mời thêm</button>` : "")}
          ${card("Quyền riêng tư", `<div class="text-sm flex justify-between"><span>Đồng ý chụp và hiển thị ảnh</span>${badge("Đã đồng ý", "bg-green-100 text-brand-green")}</div><p class="text-xs text-gray-500">Do nhà trường ghi nhận khi nhập học. Muốn thay đổi, hãy liên hệ nhà trường.</p>`)}
          ${card("Cài đặt thông báo", ["Nhật ký và ảnh", "Đón trả và điểm danh", "Thuốc và sức khỏe", "Học phí", "Thông báo nhà trường"].map((s, i) => `<label class="flex items-center justify-between text-sm py-1.5"><span>${s}</span><input type="checkbox" ${i === 3 && !isMain() ? "disabled" : "checked"} class="w-5 h-5 accent-[#8E2424]" onchange="toast(this.checked?'Đã bật':'Đã tắt')" /></label>`).join(""))}
          ${card("Tài khoản", `<p class="text-sm">${e(me.name)} · ${e(authPhone || session)}</p>${btn("Đăng xuất mọi thiết bị", "toast('Đã đăng xuất các thiết bị khác'); ", "ghost", "fa-laptop")}`)}`;
      }
      function inviteRelative() {
        openModal("Mời người thân", `<form onsubmit="saveInvite(event)" novalidate class="space-y-4">${field("Số điện thoại", "iv-p", "", { type: "tel", inputmode: "tel" })}${field("Quan hệ", "iv-r", "Bà", { type: "select", options: ["Bố", "Mẹ", "Ông", "Bà", "Khác"].map((x) => [x, x]) })}<p class="text-xs text-gray-500">Người thân có quyền "Xem": nhật ký, thực đơn, thông báo, đón bé và nhắn cô. Không xem học phí. Nhà trường sẽ xác nhận số điện thoại.</p><button class="tap w-full bg-brand-primary text-white font-bold rounded-2xl text-sm">Gửi lời mời</button></form>`);
      }
      function saveInvite(ev) {
        ev.preventDefault();
        const p = $("iv-p");
        if (!fieldError(p, isPhone(p.value) ? "" : "Số điện thoại chưa đúng.")) return;
        closeModal(); toast("Đã gửi lời mời, chờ nhà trường xác nhận");
      }

      /* ===== KHỞI TẠO ===== */
      if (session && USERS[session]) { authPhone = session; loadUser(); } else session = null;
      window.addEventListener("hashchange", route);
      if (!location.hash) location.hash = session ? "#/home" : "#/login"; else route();
    </script>
  </body>
</html>
