      document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { closeModal(); toggleSidebar(false); } });
      document.addEventListener("click", (ev) => { const m = $("user-menu"); if (m && !m.classList.contains("hidden") && !ev.target.closest("#user-menu, #user-btn")) toggleUserMenu(false); });
      function toggleUserMenu(force) { const m = $("user-menu"); const open = force === undefined ? m.classList.contains("hidden") : force; m.classList.toggle("hidden", !open); $("user-btn").setAttribute("aria-expanded", open); }
      function toggleSidebar(open) { $("sidebar").classList.toggle("-translate-x-full", !open); $("overlay").classList.toggle("hidden", !open); }
      const confirmAction = (msg, fn) => openModal("Xác nhận", `<p class="text-sm text-gray-700">${msg}</p><div class="flex justify-end gap-2">${btn("Hủy", "closeModal()")}${btn("Đồng ý", `closeModal();${fn}`, "primary")}</div>`);
      const refresh = () => route();

      /* ===== ĐỊNH TUYẾN ===== */
      const RENDER = { home: () => pgHome(), class: () => pgClass(), pickup: () => pgPickup(), students: () => pgStudents(), health: () => pgHealth(), menu: () => pgMenu(), comms: () => pgComms(), fees: () => pgFees(), crm: () => pgCrm(), reports: () => pgReports(), lessons: () => pgLessons(), hr: () => pgHr(), admin: () => pgAdmin(), profile: () => pgProfile() };
      function buildNav(active) {
        const groups = {};
        Object.entries(PAGES).forEach(([id, p]) => { if (p.hidden || !lvl(id)) return; (groups[p.group || ""] = groups[p.group || ""] || []).push([id, p]); });
        $("nav").innerHTML = Object.entries(groups).map(([g, items]) => `${g ? `<p class="px-3 pt-4 pb-1 text-xs font-bold uppercase tracking-wide text-gray-400">${g}</p>` : ""}${items.map(([id, p]) => `<button onclick="navigate('${id}')" class="nav-item ${id === active ? "active" : ""}" ${id === active ? 'aria-current="page"' : ""}><i class="fa-solid ${p.icon} w-4 text-center"></i><span>${p.title}</span>${lvl(id) === "v" ? '<i class="fa-solid fa-eye ml-auto text-xs opacity-60" title="Chỉ xem"></i>' : ""}</button>`).join("")}`).join("");
        $("side-foot").innerHTML = `${e(R().label)}<br>${R().campus ? e(CAMP[R().campus]) : "Toàn hệ thống"}`;
      }
      function navigate(id) { const h = "#/" + id; if (location.hash === h) route(); else location.hash = h; }
      function route() {
        const id = location.hash.replace(/^#\/?/, "").split("/")[0] || (session ? "home" : "login");
        closeModal(); toggleSidebar(false);
        if (!session) { showAuth(id === "forgot" ? "forgot" : "login"); return; }
        if (id === "login" || id === "forgot") { navigate("home"); return; }
        $("auth-screen").classList.add("hidden"); $("app").classList.remove("hidden"); $("app").classList.add("md:flex");
        const p = PAGES[id];
        buildNav(id);
        if (!p) { status(404, "Không tìm thấy trang"); return; }
        if (!lvl(id)) { status(403, "Bạn không có quyền truy cập mục này"); return; }
        $("page-title").textContent = p.title; document.title = p.title + " | Portal Ánh Dương";
        $("view").innerHTML = RENDER[id]();
        $("view").focus({ preventScroll: true });
        window.scrollTo({ top: 0 });
      }
      function status(code, text) { $("page-title").textContent = text; $("view").innerHTML = `<div class="py-16 text-center space-y-3"><p class="text-6xl font-bold text-brand-primary">${code}</p><h2 class="text-xl font-bold">${text}</h2>${btn("Về trang chủ", "navigate('home')", "primary")}</div>`; }
      function switchRole(r) {
        role = r;
        try { sessionStorage.setItem("sp-role", r); } catch (x) { /* bỏ qua */ }
        fillRoleSelects();
        const p = R();
        $("user-name").textContent = p.name; $("user-avatar").textContent = p.name.split(" ").slice(-1)[0][0]; $("user-role").textContent = p.label + (p.campus ? " · " + CAMP[p.campus] : " · toàn hệ thống");
        const cur = location.hash.replace(/^#\/?/, "").split("/")[0] || "home";
        if (PAGES[cur] && !lvl(cur)) navigate("home"); else route();
      }
      function fillRoleSelects() { ["role-switch", "role-switch-m"].forEach((id) => { $(id).innerHTML = Object.entries(ROLE_DEF).map(([k, v]) => `<option value="${k}" ${k === role ? "selected" : ""}>${v.label}</option>`).join(""); }); }

      /* ===== ĐĂNG NHẬP ===== */
      function showAuth(step) {
        $("app").classList.add("hidden"); $("app").classList.remove("md:flex"); $("auth-screen").classList.remove("hidden");
        document.title = "Đăng nhập | Portal Ánh Dương";
        if (step === "tfa") { $("auth-body").innerHTML = `<form onsubmit="submitTfa(event)" novalidate class="space-y-4"><h1 class="text-xl font-bold text-center">Xác thực hai bước</h1><p class="text-xs text-gray-500 text-center">Vai trò ${e(ROLE_DEF[tfaPending].label)} bắt buộc xác thực hai bước. Nhập mã 6 số từ ứng dụng Authenticator.</p>${field("Mã xác thực", "tfa", "", { inputmode: "numeric", ph: "______" })}<button class="tap w-full bg-brand-primary text-white font-bold rounded-xl text-sm">Xác nhận</button><button type="button" onclick="showAuth()" class="w-full text-xs text-gray-500">Quay lại</button><p class="text-xs text-gray-500 text-center bg-brand-tint rounded-xl p-3">Demo: nhập 6 số bất kỳ.</p></form>`; return; }
        if (step === "forgot") { $("auth-body").innerHTML = `<form onsubmit="submitForgot(event)" novalidate class="space-y-4"><h1 class="text-xl font-bold text-center">Quên mật khẩu</h1>${field("Email", "fg", "", { type: "email" })}<button class="tap w-full bg-brand-primary text-white font-bold rounded-xl text-sm">Gửi liên kết đặt lại</button><button type="button" onclick="navigate('login')" class="w-full text-xs text-brand-primary">Quay lại đăng nhập</button></form>`; return; }
        $("auth-body").innerHTML = `<form onsubmit="submitLogin(event)" novalidate class="space-y-4"><h1 class="text-xl font-bold text-center">Đăng nhập Portal</h1>${field("Email", "lg-email", "", { type: "email", ph: "ten@anhduong.edu.vn" })}${field("Mật khẩu", "lg-pass", "", { type: "password" })}${field("Vai trò dùng thử", "lg-role", role, { type: "select", options: Object.entries(ROLE_DEF).map(([k, v]) => [k, v.label + (v.tfa ? " (có xác thực 2 bước)" : "")]) })}<button class="tap w-full bg-brand-primary text-white font-bold rounded-xl text-sm">Đăng nhập</button><button type="button" onclick="navigate('forgot')" class="w-full text-xs text-brand-primary">Quên mật khẩu?</button><p class="text-xs text-gray-500 text-center bg-brand-tint rounded-xl p-3">Demo: email hợp lệ bất kỳ, mật khẩu bất kỳ. Chọn vai trò để xem menu và quyền tương ứng.</p></form>`;
      }
      function submitLogin(ev) {
        ev.preventDefault();
        const em = $("lg-email"), pw = $("lg-pass");
        const ok = fieldError(em, isEmail(em.value) ? "" : "Email chưa đúng định dạng.") & fieldError(pw, pw.value ? "" : "Vui lòng nhập mật khẩu.");
        if (!ok) return;
        tfaPending = $("lg-role").value;
        if (ROLE_DEF[tfaPending].tfa) { showAuth("tfa"); return; }
        finishLogin(tfaPending);
      }
      function submitTfa(ev) { ev.preventDefault(); const t = $("tfa"); if (!fieldError(t, /^\d{6}$/.test(t.value) ? "" : "Mã gồm 6 chữ số.")) return; finishLogin(tfaPending); }
      function submitForgot(ev) { ev.preventDefault(); const f = $("fg"); if (!fieldError(f, isEmail(f.value) ? "" : "Email chưa đúng định dạng.")) return; $("auth-body").innerHTML = `<div class="text-center space-y-3"><i class="fa-solid fa-envelope-circle-check text-4xl text-brand-green"></i><p class="text-sm">Nếu email tồn tại, liên kết đặt lại mật khẩu đã được gửi (hiệu lực 30 phút).</p><button onclick="navigate('login')" class="text-xs text-brand-primary">Quay lại đăng nhập</button></div>`; }
      function finishLogin(r) { session = true; role = r; try { sessionStorage.setItem("sp-session", "1"); sessionStorage.setItem("sp-role", r); } catch (x) { /* bỏ qua */ } audit("Đăng nhập"); fillRoleSelects(); switchRole(r); navigate("home"); }
      function logout() { audit("Đăng xuất"); session = false; try { sessionStorage.removeItem("sp-session"); } catch (x) { /* bỏ qua */ } toggleUserMenu(false); navigate("login"); }

      /* ===== TRANG CHỦ ===== */
      function stat(icon, tone, value, label, to) { return `<button onclick="navigate('${to}')" class="text-left bg-white p-4 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition"><div class="w-9 h-9 rounded-xl ${tone} flex items-center justify-center mb-2"><i class="fa-solid ${icon}"></i></div><p class="text-2xl font-bold">${value}</p><p class="text-xs text-gray-500">${label}</p></button>`; }
      function pgHome() {
        const r = R();
        const hello = `<div><p class="text-xs text-gray-500">${fmtDate(TODAY)} · ${e(r.label)}</p><h2 class="text-xl font-bold">Xin chào, ${e(r.name)}</h2></div>`;
        const kids = stuScope();
        let cards = "";
        if (role === "gvcn" || role === "gvnk") {
          const notMarked = kids.filter((k) => !ATT[k.id]).length;
          const noDiary = kids.filter((k) => !DIARY[k.id]).length;
          cards = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${stat("fa-clipboard-user", "bg-yellow-100 text-brand-gold", notMarked, "Chưa điểm danh", "class")}${stat("fa-book-open", "bg-blue-100 text-brand-blue", noDiary, "Chưa nhập nhật ký", "class")}${stat("fa-pills", "bg-green-100 text-brand-green", MEDS.filter((m) => kids.some((k) => k.id === m.kid) && m.status !== "Đã cho uống").length, "Đơn thuốc chờ", "class")}${stat("fa-comments", "bg-brand-tint2 text-brand-primary", THREADS.filter((t) => t.cls === r.cls).reduce((s, t) => s + t.unread, 0), "Tin nhắn chưa đọc", "comms")}</div><div class="flex flex-wrap gap-2">${btn("Điểm danh lớp", "navigate('class')", "primary", "fa-clipboard-user")}${btn("Quét QR đón", "navigate('pickup')", "ghost", "fa-qrcode")}${btn("Nộp giáo án", "navigate('lessons')", "ghost", "fa-book")}</div>`;
        } else if (role === "yte") {
          cards = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${stat("fa-pills", "bg-green-100 text-brand-green", MEDS.filter((m) => m.status !== "Đã cho uống").length, "Đơn thuốc cần xử lý", "health")}${stat("fa-triangle-exclamation", "bg-yellow-100 text-brand-gold", STUDENTS.filter((s) => s.allergy && inScope(s.campus)).length, "Bé có dị ứng", "health")}</div>`;
        } else if (role === "bep") {
          cards = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${stat("fa-triangle-exclamation", "bg-yellow-100 text-brand-gold", STUDENTS.filter((s) => s.allergy && inScope(s.campus)).length, "Bé cần tránh món", "menu")}${stat("fa-utensils", "bg-green-100 text-brand-green", "5", "Ngày có thực đơn tuần này", "menu")}</div>`;
        } else if (role === "ketoan") {
          const due = FEE_ITEMS.filter((f) => f.status !== "Đã đóng" && inScope(STUDENTS.find((s) => s.id === f.kid).campus));
          cards = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${stat("fa-triangle-exclamation", "bg-red-100 text-red-700", due.filter((f) => f.status === "Quá hạn").length, "Khoản quá hạn", "fees")}${stat("fa-wallet", "bg-yellow-100 text-brand-gold", money(due.reduce((s, f) => s + f.amount, 0)), "Công nợ", "fees")}${stat("fa-receipt", "bg-green-100 text-brand-green", FEE_ITEMS.filter((f) => f.paidDate === "2026-10-04" || f.paidDate === "2026-10-03").length, "Biên lai gần đây", "fees")}</div>`;
        } else if (role === "vanphong") {
          cards = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${stat("fa-user-plus", "bg-blue-100 text-brand-blue", LEADS.filter((l) => l.status === "Mới" && inScope(l.campus)).length, "Lead mới cần xử lý", "crm")}${stat("fa-children", "bg-green-100 text-brand-green", STUDENTS.filter((s) => inScope(s.campus) && !s.account).length, "Học sinh chưa có tài khoản App", "students")}</div>`;
        } else if (role === "bgh") {
          cards = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${stat("fa-people-group", "bg-green-100 text-brand-green", STUDENTS.filter((s) => inScope(s.campus)).length, "Học sinh đang học", "students")}${stat("fa-book", "bg-blue-100 text-brand-blue", PLANS.filter((p) => p.status === "sent").length, "Giáo án chờ duyệt", "lessons")}${stat("fa-user-clock", "bg-yellow-100 text-brand-gold", OTS.filter((o) => o.status === "Chờ duyệt").length, "Tăng ca chờ duyệt", "hr")}${stat("fa-calendar-xmark", "bg-brand-tint2 text-brand-primary", LEAVES.filter((l) => l.status === "Chờ xác nhận").length, "Xin nghỉ chờ", "class")}</div>`;
        } else if (role === "lanhdao") {
          cards = `${info("Bạn có quyền chỉ xem báo cáo toàn hệ thống, không sửa dữ liệu gốc.")}<div class="flex">${btn("Mở Dashboard HQ", "navigate('reports')", "primary", "fa-chart-column")}</div>`;
        } else {
          cards = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${stat("fa-users-gear", "bg-blue-100 text-brand-blue", ACCOUNTS.length, "Tài khoản nhân sự", "admin")}</div>`;
        }
        const todayCheck = CHECKINS.find((c) => c.name === r.name);
        const self = role === "lanhdao" || role === "admin" ? "" : card("Chấm công của tôi", `<div class="flex flex-wrap items-center justify-between gap-3"><p class="text-sm">${todayCheck ? `Đã chấm vào lúc <strong>${todayCheck.in}</strong>${todayCheck.out ? `, ra lúc <strong>${todayCheck.out}</strong>` : ""}` : "Hôm nay bạn chưa chấm công."}</p>${todayCheck ? (todayCheck.out ? "" : btn("Chấm ra", "checkOut()", "ghost", "fa-right-from-bracket")) : btn("Chấm vào", "checkIn()", "primary", "fa-fingerprint")}</div>`);
        return hello + cards + self;
      }
      function nowHM() { const d = new Date(), p = (n) => String(n).padStart(2, "0"); return p(d.getHours()) + ":" + p(d.getMinutes()); }
      function checkIn() { CHECKINS.push({ id: Date.now(), name: R().name, date: TODAY, in: nowHM(), out: "", status: "Đã chấm" }); audit("Chấm công vào"); toast("Đã chấm công vào"); refresh(); }
      function checkOut() { CHECKINS.find((c) => c.name === R().name).out = nowHM(); audit("Chấm công ra"); toast("Đã chấm công ra"); refresh(); }

      /* ===== LỚP CỦA TÔI ===== */
      let classTab = "att", leaveFilter = "";
      function pgClass() {
        const cls = role === "bgh" ? "" : R().cls;
        const t = [["att", "Điểm danh"], ["diary", "Nhật ký"], ["leave", "Xin nghỉ"], ["meds", "Đơn thuốc"]];
        const limited = role === "gvnk";
        const tl = limited ? t.filter((x) => x[0] === "att" || x[0] === "diary") : t;
        if (!tl.some((x) => x[0] === classTab)) classTab = "att";
        const head = `<div class="flex flex-wrap items-center justify-between gap-2"><div><h2 class="font-bold">${cls ? e(CLASSES[cls].name) : "Toàn cơ sở " + e(CAMP[myCampus()])}</h2><p class="text-xs text-gray-500">${cls ? e(CLASSES[cls].teacher) + " · " : ""}${stuScope().length} bé</p></div></div>`;
        const body = { att: pgAtt, diary: pgDiaryEntry, leave: pgLeaveReview, meds: pgClassMeds }[classTab]();
        return head + (role === "bgh" ? roNote("BGH xem toàn cơ sở, không nhập nhật ký thay giáo viên.") : "") + (limited ? roNote("GV năng khiếu/bảo mẫu chỉ nhập điểm danh và nhật ký phần được giao.") : "") + tabs(tl, classTab, "setClassTab") + body;
      }
      const setClassTab = (t) => { classTab = t; refresh(); };
      function pgAtt() {
        const kids = stuScope(), ro = !canManage("class") || role === "bgh";
        const cnt = (v) => kids.filter((k) => ATT[k.id] === v).length;
        const seg = (k, v, label, cls) => `<button ${ro ? "disabled" : ""} aria-pressed="${ATT[k.id] === v}" onclick="setAtt('${k.id}','${v}')" class="seg ${ATT[k.id] === v ? cls : ""}">${label}</button>`;
        return card("Điểm danh " + fmtDate(TODAY), `<div class="flex flex-wrap gap-3 text-xs mb-3"><span class="text-brand-green font-bold">Có mặt ${cnt("ok")}</span><span class="text-brand-gold font-bold">Vắng có phép ${cnt("leave")}</span><span class="text-red-600 font-bold">Vắng không phép ${cnt("abs")}</span><span class="text-gray-500">Chưa điểm danh ${kids.filter((k) => !ATT[k.id]).length}</span></div><div class="space-y-2">${kids.map((k) => `<div class="flex flex-wrap items-center justify-between gap-2 p-2 rounded-xl bg-brand-cream"><span class="flex items-center gap-2 text-sm font-semibold"><span class="w-8 h-8 rounded-full bg-brand-tint2 text-brand-primary text-xs flex items-center justify-center">${e(k.name.replace("Bé ", "")[0])}</span>${e(k.name)}${k.allergy ? ' <i class="fa-solid fa-triangle-exclamation text-brand-gold text-xs" title="Dị ứng: ' + e(k.allergy) + '"></i>' : ""}</span><span class="inline-flex">${seg(k, "ok", "Có mặt", "on-ok")}${seg(k, "leave", "Có phép", "on-leave")}${seg(k, "abs", "Không phép", "on-abs")}</span></div>`).join("")}</div>${ro ? "" : `<div class="flex flex-wrap justify-end gap-2 mt-4">${btn("Đánh dấu cả lớp có mặt", "markAllPresent()", "ghost", "fa-check-double")}${btn("Lưu điểm danh", "saveAtt()", "primary", "fa-floppy-disk")}</div>`}`);
      }
      function setAtt(id, v) { ATT[id] = v; refresh(); }
      function markAllPresent() { stuScope().forEach((k) => { if (!ATT[k.id]) ATT[k.id] = "ok"; }); refresh(); }
      function saveAtt() { const n = stuScope().filter((k) => !ATT[k.id]).length; if (n) { toast(n + " bé chưa được điểm danh", "error"); return; } audit("Lưu điểm danh lớp " + CLASSES[R().cls].name); toast("Đã lưu điểm danh. Phụ huynh sẽ thấy trên App."); }
      let diaryKid = "";
      function pgDiaryEntry() {
        const kids = stuScope(), ro = !canManage("class") || role === "bgh";
        if (!diaryKid || !kids.some((k) => k.id === diaryKid)) diaryKid = kids[0] ? kids[0].id : "";
        const k = kids.find((x) => x.id === diaryKid);
        if (!k) return card("Nhật ký", `<p class="text-sm text-gray-500 text-center py-6">Chưa có học sinh.</p>`);
        const d = DIARY[k.id] || { breakfast: "Ăn hết suất", lunch: "Ăn hết suất", dinner: "", sleepFrom: "12:20", sleepTo: "14:20", wc: "2 lần, bình thường", mood: "Vui vẻ", remark: "" };
        const eat = ["", "Ăn hết suất", "Ăn 3/4 suất", "Ăn nửa suất", "Ăn ít", "Không ăn"].map((x) => [x, x || "Chưa ghi"]);
        const sel = (id, v) => field("", id, v, { type: "select", options: eat, ro });
        return card("Nhật ký ngày " + fmtDate(TODAY), `<div class="flex gap-2 overflow-x-auto no-scrollbar pb-3">${kids.map((x) => `<button onclick="diaryKid='${x.id}';refresh()" class="tab-btn ${x.id === diaryKid ? "active" : ""}">${e(x.name)}${DIARY[x.id] ? " ✓" : ""}</button>`).join("")}</div>
          <form onsubmit="saveDiary(event)" novalidate class="space-y-4">
            <div class="grid sm:grid-cols-3 gap-3"><div><p class="text-xs font-semibold mb-1">Bữa sáng</p>${sel("d-b", d.breakfast)}</div><div><p class="text-xs font-semibold mb-1">Bữa trưa</p>${sel("d-l", d.lunch)}</div><div><p class="text-xs font-semibold mb-1">Bữa chiều</p>${sel("d-d", d.dinner)}</div></div>
            <div class="grid sm:grid-cols-4 gap-3">${field("Ngủ từ", "d-sf", d.sleepFrom, { type: "time", ro })}${field("Dậy lúc", "d-st", d.sleepTo, { type: "time", ro })}${field("Vệ sinh", "d-wc", d.wc, { ro })}${field("Tâm trạng", "d-m", d.mood, { type: "select", options: ["Vui vẻ", "Hào hứng", "Hơi mệt", "Quấy khóc", "Trầm lặng"].map((x) => [x, x]), ro })}</div>
            ${field("Nhận xét", "d-r", d.remark, { type: "textarea", ro, ph: "Nhận xét ngắn về bé hôm nay" })}
            <div>${field("Ảnh hoạt động", "d-p", "", { type: "file", accept: "image/*", ro: ro || !k.consent, hint: k.consent ? "Chỉ ảnh JPG/PNG, tối đa 5MB. Ảnh tự xóa sau 6 tháng." : '<span class="text-red-600 font-semibold">Phụ huynh chưa đồng ý chụp và hiển thị ảnh của bé này. Không đăng ảnh.</span>' })}</div>
            ${ro ? "" : `<div class="flex flex-wrap justify-end gap-2">${btn("Áp dụng ăn/ngủ cho cả lớp", "applyDiaryAll()", "ghost", "fa-copy")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Lưu nhật ký</button></div>`}

        const perCampus = campuses.map((c) => [e(CAMP[c]), STUDENTS.filter((s) => s.campus === c).length, rate[c] + "%", money(FEE_ITEMS.filter((f) => STUDENTS.find((s) => s.id === f.kid).campus === c && f.status === "Đã đóng").reduce((s, f) => s + f.amount, 0)), money(FEE_ITEMS.filter((f) => STUDENTS.find((s) => s.id === f.kid).campus === c && (f.status === "Chưa đóng" || f.status === "Quá hạn")).reduce((s, f) => s + f.amount, 0)), LEADS.filter((l) => l.campus === c).length]);
        return `<div class="flex flex-wrap items-center justify-between gap-3">${sel}${btn("Xuất báo cáo", "exportReport()", "ghost", "fa-file-export")}</div>
          <h2 class="font-bold text-sm text-brand-primary">Sĩ số và chuyên cần</h2><div class="grid sm:grid-cols-3 gap-3">${m("Sĩ số đang học", stu.length, "bé")}${m("Có mặt hôm nay", Object.values(ATT).filter((v) => v === "ok").length, "bé (lớp đã điểm danh)")}${m("Chuyên cần tháng", avgRate + "%", "có mặt / ngày học theo lịch")}</div>
          <h2 class="font-bold text-sm text-brand-primary">Học phí</h2><div class="grid sm:grid-cols-3 gap-3">${m("Phải thu", money(sumF(["Đã đóng", "Chưa đóng", "Quá hạn"])), "tháng 10/2026")}${m("Đã thu", money(sumF(["Đã đóng"])), "")}${m("Còn nợ", money(sumF(["Chưa đóng", "Quá hạn"])), "gồm quá hạn " + money(sumF(["Quá hạn"])))}</div>
          <h2 class="font-bold text-sm text-brand-primary">Nhân sự</h2><div class="grid sm:grid-cols-3 gap-3">${m("Sĩ số giáo viên, nhân viên", STAFF.length, "đang làm việc")}${m("Đi làm hôm nay", CHECKINS.filter((c) => c.date === TODAY).length + "/" + STAFF.length, "đã chấm công")}${m("Tăng ca tháng", OTS.reduce((s, o) => s + o.hours, 0) + " giờ", "gồm chờ duyệt")}</div>
          <h2 class="font-bold text-sm text-brand-primary">Tuyển sinh</h2><div class="grid sm:grid-cols-3 gap-3">${m("Số lead", leads.length, "trong kỳ")}${m("Nhập học", enrolled, "")}${m("Tỷ lệ chuyển đổi", conv + "%", "nhập học / lead tạo trong kỳ")}</div>
          ${card("Theo cơ sở", table(["Cơ sở", "Sĩ số", "Chuyên cần", "Đã thu", "Còn nợ", "Lead"], perCampus))}`;
      }
      function exportReport() { audit("Xuất báo cáo Dashboard"); toast("Đã xuất báo cáo và ghi nhật ký (demo)"); }

      /* ===== GIÁO ÁN ===== */
      function pgLessons() {
        const manage = role === "bgh", submit = role === "gvcn" || role === "gvnk";
        const list = PLANS.filter((p) => (submit ? p.teacher === R().name : true));
        return `${submit ? "" : manage ? "" : roNote()}
          ${card(manage ? "Giáo án chờ duyệt và đã duyệt" : "Giáo án của tôi", table(["Giáo viên", "Lớp", "Kỳ", "File", "Trạng thái", ""], list.map((p) => [e(p.teacher), e(CLASSES[p.cls].name), e(p.period), `<span class="text-brand-primary"><i class="fa-regular fa-file-lines mr-1"></i>${e(p.file)}</span>`, badge(PLAN_STATUS[p.status][0], PLAN_STATUS[p.status][1]) + (p.note ? `<div class="text-gray-500 mt-1">${e(p.note)}</div>` : ""), manage && p.status === "sent" ? `<div class="flex gap-1">${btn("Duyệt", `reviewPlan(${p.id},'ok')`, "green")}${btn("Trả lại", `modalReturn(${p.id})`, "danger")}</div>` : submit && p.status === "fix" ? btn("Nộp lại", "modalPlan()", "ghost") : ""]), "Chưa có giáo án."), submit ? btn("Nộp giáo án", "modalPlan()", "primary", "fa-upload") : "")}
          ${card("Khung chương trình theo khối tuổi", `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">${["Nhà trẻ (12 - 36 tháng)", "Mẫu giáo Bé (3 - 4 tuổi)", "Mẫu giáo Nhỡ (4 - 5 tuổi)", "Mẫu giáo Lớn (5 - 6 tuổi)"].map((x) => `<div class="bg-brand-cream rounded-xl p-3 font-semibold"><i class="fa-solid fa-book-open text-brand-primary mr-2"></i>${x}</div>`).join("")}</div>`)}
          ${card("Kho tài nguyên giảng dạy", table(["Tài nguyên", "Chủ đề", ""], RESOURCES.map((r) => [e(r[0]), e(r[1]), btn("Tải về", "toast('Đã tải (demo)')", "ghost", "fa-download")])))}`;
      }
      function modalPlan() { openModal("Nộp giáo án", `<form onsubmit="savePlan(event)" novalidate class="space-y-4">${field("Kỳ", "pl-p", "Tuần 42 (12/10 - 16/10)", { type: "select", options: ["Tuần 42 (12/10 - 16/10)", "Tuần 43 (19/10 - 23/10)", "Tháng 11/2026"].map((x) => [x, x]) })}${field("File giáo án * (PDF, DOC, DOCX, tối đa 10MB)", "pl-f", "", { type: "file", accept: ".pdf,.doc,.docx" })}${field("Ghi chú", "pl-n", "", { type: "textarea" })}<div class="flex justify-end gap-2">${btn("Hủy", "closeModal()")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Nộp</button></div></form>`); }
      function savePlan(ev) { ev.preventDefault(); const f = $("pl-f"), file = f.files[0]; const msg = !file ? "Vui lòng chọn file." : !/\.(pdf|docx?)$/i.test(file.name) ? "Chỉ nhận PDF, DOC hoặc DOCX." : file.size > 10 * 1024 * 1024 ? "File vượt quá 10MB." : ""; if (!fieldError(f, msg)) return; PLANS.unshift({ id: Date.now(), teacher: R().name, cls: R().cls, period: $("pl-p").value, file: file.name, status: "sent", note: "" }); audit("Nộp giáo án " + file.name); closeModal(); toast("Đã nộp giáo án, chờ BGH duyệt"); refresh(); }
      function reviewPlan(id, st) { const p = PLANS.find((x) => x.id === id); p.status = st; audit("Duyệt giáo án " + p.file); toast("Đã duyệt giáo án"); refresh(); }
      function modalReturn(id) { openModal("Trả lại giáo án", `<form onsubmit="doReturn(event,${id})" novalidate class="space-y-4">${field("Nhận xét cần sửa *", "rt", "", { type: "textarea" })}<div class="flex justify-end gap-2">${btn("Hủy", "closeModal()")}<button class="tap px-5 rounded-full bg-red-600 text-white text-xs font-semibold">Trả lại</button></div></form>`); }
      function doReturn(ev, id) { ev.preventDefault(); const r = $("rt"); if (!fieldError(r, r.value.trim() ? "" : "Vui lòng nhập nhận xét.")) return; const p = PLANS.find((x) => x.id === id); p.status = "fix"; p.note = r.value.trim(); audit("Trả lại giáo án " + p.file); closeModal(); toast("Đã trả lại giáo viên"); refresh(); }

      /* ===== NHÂN SỰ ===== */
      let hrTab = "check", sheetLocked = false;
      function pgHr() {
        const manage = role === "bgh", view = role === "vanphong" || role === "lanhdao";
        const t = [["check", "Chấm công"], ["ot", "Tăng ca"], ["assign", "Phân công"], ["sheet", "Bảng công tháng"]];
        const body = {
          check: () => card("Chấm công hôm nay", table(["Nhân viên", "Vào", "Ra", "Trạng thái"], (manage || view ? CHECKINS : CHECKINS.filter((c) => c.name === R().name)).map((c) => [e(c.name), c.in, c.out || "-", badge(c.status, "bg-green-100 text-brand-green")]), "Chưa có lượt chấm công."), (manage ? btn("Thêm xác nhận ngoại lệ", "modalException2()", "ghost", "fa-user-pen") : "")) + info("Nhân viên tự chấm tại cơ sở (QR cơ sở đổi theo ngày). BGH xác nhận trường hợp quên chấm hoặc lỗi."),
          ot: () => card("Tăng ca", table(["Nhân viên", "Ngày", "Giờ", "Lý do", "Trạng thái", ""], (manage || view ? OTS : OTS.filter((o) => o.name === R().name)).map((o) => [e(o.name), fmtDate(o.date), o.hours, e(o.reason), badge(o.status, o.status === "Đã duyệt" ? "bg-green-100 text-brand-green" : o.status === "Từ chối" ? "bg-red-100 text-red-700" : "bg-yellow-100 text-brand-gold"), manage && o.status === "Chờ duyệt" ? `<div class="flex gap-1">${btn("Duyệt", `setOt(${o.id},'Đã duyệt')`, "green")}${btn("Từ chối", `setOt(${o.id},'Từ chối')`, "danger")}</div>` : ""]), "Chưa có đăng ký tăng ca."), role === "lanhdao" ? "" : btn("Đăng ký tăng ca", "modalOt()", "primary", "fa-plus")),
          assign: () => (manage ? "" : roNote()) + card("Phân công lớp và ca", table(["Nhân sự", "Vai trò", "Lớp", "Ca"], STAFF.map((s) => [e(s.name), e(s.role), s.cls ? e(CLASSES[s.cls].name) : "-", e(s.shift)])), manage ? btn("Sửa phân công", "toast('Đã mở chỉnh sửa phân công (demo)')", "ghost", "fa-pen") : ""),
          sheet: () => card("Bảng công tháng 10/2026", table(["Nhân viên", "Ngày công", "Vắng", "Tăng ca (giờ)"], STAFF.map((s, i) => [e(s.name), 5 - (i === 2 ? 1 : 0), i === 2 ? 1 : 0, OTS.filter((o) => o.name === s.name && o.status === "Đã duyệt").reduce((a, o) => a + o.hours, 0)])), `<div class="flex items-center gap-2">${badge(sheetLocked ? "Đã khóa sổ" : "Đang ghi", sheetLocked ? "bg-gray-200 text-gray-600" : "bg-green-100 text-brand-green")}${manage && !sheetLocked ? btn("Khóa sổ", "confirmAction('Khóa sổ bảng công tháng 10? Sau khi khóa không sửa được.','lockSheet()')", "danger", "fa-lock") : ""}${manage || view ? btn("Xuất cho kế toán", "exportSheet()", "ghost", "fa-file-export") : ""}</div>`) + info("Portal không tính lương. Bảng công xuất cuối tháng để kế toán tính lương bên ngoài."),
        };
        return tabs(t, hrTab, "setHrTab") + body[hrTab]();
      }
      const setHrTab = (t) => { hrTab = t; refresh(); };
      function setOt(id, st) { OTS.find((o) => o.id === id).status = st; audit("Tăng ca #" + id + ": " + st); toast("Đã " + st.toLowerCase()); refresh(); }
      function modalOt() { openModal("Đăng ký tăng ca", `<form onsubmit="saveOt(event)" novalidate class="space-y-4"><div class="grid grid-cols-2 gap-3">${field("Ngày", "ot-d", TODAY, { type: "date" })}${field("Số giờ", "ot-h", "1", { inputmode: "decimal" })}</div>${field("Lý do *", "ot-r", "", { type: "textarea" })}<div class="flex justify-end gap-2">${btn("Hủy", "closeModal()")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Gửi BGH duyệt</button></div></form>`); }
      function saveOt(ev) { ev.preventDefault(); const h = $("ot-h"), r = $("ot-r"), hv = parseFloat(h.value.replace(",", ".")); const ok = fieldError(h, hv > 0 && hv <= 6 ? "" : "Số giờ từ 0.5 đến 6.") & fieldError(r, r.value.trim() ? "" : "Vui lòng nhập lý do."); if (!ok) return; OTS.unshift({ id: Date.now(), name: R().name, date: $("ot-d").value, hours: hv, reason: r.value.trim(), status: "Chờ duyệt" }); audit("Đăng ký tăng ca " + hv + " giờ"); closeModal(); toast("Đã gửi BGH duyệt"); refresh(); }
      function modalException2() { openModal("Xác nhận chấm công ngoại lệ", `<form onsubmit="event.preventDefault();closeModal();audit('Xác nhận chấm công ngoại lệ');toast('Đã ghi nhận')" class="space-y-4">${field("Nhân viên", "x-n", STAFF[0].name, { type: "select", options: STAFF.map((s) => [s.name, s.name]) })}<div class="grid grid-cols-2 gap-3">${field("Giờ vào", "x-i", "07:30", { type: "time" })}${field("Giờ ra", "x-o", "16:30", { type: "time" })}</div>${field("Lý do", "x-r", "Quên chấm công", {})}<div class="flex justify-end gap-2">${btn("Hủy", "closeModal()")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Ghi nhận</button></div></form>`); }
      function lockSheet() { sheetLocked = true; audit("Khóa sổ bảng công tháng 10"); toast("Đã khóa sổ"); refresh(); }
      function exportSheet() { audit("Xuất bảng công tháng 10"); toast("Đã xuất bảng công và ghi nhật ký (demo)"); }

      /* ===== QUẢN TRỊ ===== */
      let adminTab = "acc", auditQ = "";
      function pgAdmin() {
        const full = role === "admin";
        const t = [["acc", "Tài khoản nhân sự"], ["cat", "Danh mục"], ["cfg", "Cấu hình"], ...(full ? [["audit", "Nhật ký hoạt động"]] : [])];
        if (!t.some((x) => x[0] === adminTab)) adminTab = "acc";
        const list = ACCOUNTS.filter((a) => inScope(a.campus) || a.campus === "");
        const body = {
          acc: () => (full ? "" : roNote("BGH cơ sở chỉ khóa/mở tài khoản và gán lớp trong cơ sở mình; Quản trị hệ thống tạo tài khoản mới.")) + card("Tài khoản", table(["Người dùng", "Vai trò", "Phạm vi", "Trạng thái", ""], list.map((a) => [`<strong>${e(a.name)}</strong><br><span class="text-gray-500">${e(a.email)}</span>`, e(ROLE_DEF[a.role].label), a.campus ? e(CAMP[a.campus]) : "Toàn hệ thống", badge(a.locked ? "Đã khóa" : "Hoạt động", a.locked ? "bg-red-100 text-red-700" : "bg-green-100 text-brand-green"), a.role === "admin" ? "" : `<div class="flex flex-wrap gap-1">${btn(a.locked ? "Mở khóa" : "Khóa", `toggleAcc(${a.id})`, "ghost")}${full ? btn("Đặt lại MK", `confirmAction('Gửi email đặt lại mật khẩu cho ${e(a.email)}?','resetPw(${a.id})')`, "ghost") : ""}</div>`])), full ? btn("Thêm tài khoản", "modalAcc()", "primary", "fa-user-plus") : ""),
          cat: () => (full ? "" : roNote()) + card("Danh mục", `<div class="grid md:grid-cols-2 gap-4 text-xs">${[["Cơ sở", Object.values(CAMP)], ["Lớp", Object.values(CLASSES).map((c) => c.name)], ["Ca làm việc", ["Sáng (7:00 - 11:30)", "Chiều (13:30 - 17:30)", "Cả ngày"]], ["Loại khoản thu", ["Học phí", "Tiền ăn", "Ngoại khóa", "Đón muộn"]]].map((c) => `<div class="bg-brand-cream rounded-xl p-3"><p class="font-bold text-brand-primary mb-2">${c[0]}</p><ul class="space-y-1">${c[1].map((x) => `<li>${e(x)}</li>`).join("")}</ul></div>`).join("")}</div>`),
          cfg: () => card("Cấu hình hệ thống", `<div class="grid md:grid-cols-2 gap-4">${field("Giờ làm việc của chat", "cf-1", "07:00 - 17:00, thứ 2 đến thứ 6", { ro: !full })}${field("Hạn nộp giáo án", "cf-2", "17:00 thứ 6 hằng tuần", { ro: !full })}${field("Thời gian lưu ảnh (tháng)", "cf-3", "6", { ro: !full })}${field("Nhà cung cấp OTP", "cf-4", "SMS / Zalo OA", { ro: !full })}</div>${full ? `<div class="flex justify-end mt-4">${btn("Lưu cấu hình", "audit('Lưu cấu hình');toast('Đã lưu cấu hình (demo)')", "primary")}</div>` : ""}`),
          audit: () => card("Nhật ký hoạt động", `<div class="mb-4"><input class="fld sm:max-w-sm" type="search" placeholder="Tìm theo người hoặc hành động" value="${e(auditQ)}" oninput="auditQ=this.value;refreshAudit()" aria-label="Tìm" /></div><div id="audit-table">${auditTable()}</div>`),
        };
        return tabs(t, adminTab, "setAdminTab") + body[adminTab]();
      }
      const setAdminTab = (t) => { adminTab = t; refresh(); };
      function auditTable() { return table(["Thời gian", "Người dùng", "Hành động"], AUDIT.filter((a) => !auditQ || (a.user + " " + a.action).toLowerCase().includes(auditQ.toLowerCase())).map((a) => [e(a.t), e(a.user), e(a.action)]), "Không có bản ghi."); }
      function refreshAudit() { $("audit-table").innerHTML = auditTable(); }
      function toggleAcc(id) { const a = ACCOUNTS.find((x) => x.id === id); a.locked = !a.locked; audit((a.locked ? "Khóa " : "Mở khóa ") + a.name); toast(a.locked ? "Đã khóa tài khoản" : "Đã mở khóa"); refresh(); }
      function resetPw(id) { audit("Đặt lại mật khẩu " + ACCOUNTS.find((a) => a.id === id).email); toast("Đã gửi email đặt lại mật khẩu"); }
      function modalAcc() { openModal("Thêm tài khoản", `<form onsubmit="saveAcc(event)" novalidate class="space-y-4">${field("Họ tên *", "ac-n", "")}${field("Email *", "ac-e", "", { type: "email" })}${field("Vai trò", "ac-r", "gvcn", { type: "select", options: Object.entries(ROLE_DEF).map(([k, v]) => [k, v.label]) })}${field("Cơ sở", "ac-c", "phutho1", { type: "select", options: Object.entries(CAMP) })}<div class="flex justify-end gap-2">${btn("Hủy", "closeModal()")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Tạo và gửi lời mời</button></div></form>`); }
      function saveAcc(ev) { ev.preventDefault(); const n = $("ac-n"), em = $("ac-e"); const ok = fieldError(n, n.value.trim() ? "" : "Vui lòng nhập họ tên.") & fieldError(em, !isEmail(em.value) ? "Email chưa đúng định dạng." : ACCOUNTS.some((a) => a.email === em.value) ? "Email đã tồn tại." : ""); if (!ok) return; const r = $("ac-r").value; ACCOUNTS.push({ id: Date.now(), name: n.value.trim(), email: em.value, role: r, campus: r === "lanhdao" || r === "admin" ? "" : $("ac-c").value, locked: false }); audit("Tạo tài khoản " + n.value.trim()); closeModal(); toast("Đã tạo tài khoản và gửi email mời"); refresh(); }

      /* ===== HỒ SƠ ===== */
      function pgProfile() {
        return `<div class="grid lg:grid-cols-2 gap-5">${card("Thông tin tài khoản", `<form onsubmit="event.preventDefault();toast('Đã lưu hồ sơ (demo)')" class="space-y-4">${field("Họ tên", "pf-n", R().name)}${field("Vai trò", "pf-r", R().label, { ro: true })}${field("Số điện thoại", "pf-p", "")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Lưu</button></form>`)}${card("Đổi mật khẩu", `<form onsubmit="submitPass(event)" novalidate class="space-y-4">${field("Mật khẩu hiện tại", "pw0", "", { type: "password" })}${field("Mật khẩu mới", "pw1", "", { type: "password", hint: "Tối thiểu 10 ký tự, gồm chữ hoa, chữ thường và số." })}${field("Nhập lại mật khẩu mới", "pw2", "", { type: "password" })}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Đổi mật khẩu</button></form>`)}</div>${card("Xác thực hai bước", `<p class="text-sm">${R().tfa ? badge("Bắt buộc và đang bật", "bg-green-100 text-brand-green") : badge("Khuyến nghị", "bg-yellow-100 text-brand-gold")}</p><p class="text-xs text-gray-500 mt-2">Bắt buộc cho BGH, kế toán, lãnh đạo hệ thống và quản trị.</p>`)}`;
      }
      function submitPass(ev) { ev.preventDefault(); const a = $("pw0"), b = $("pw1"), c = $("pw2"); const strong = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{10,}$/.test(b.value); const ok = fieldError(a, a.value ? "" : "Vui lòng nhập mật khẩu hiện tại.") & fieldError(b, strong ? "" : "Mật khẩu chưa đủ mạnh.") & fieldError(c, c.value === b.value ? "" : "Mật khẩu nhập lại không khớp."); if (!ok) return; ev.target.reset(); audit("Đổi mật khẩu"); toast("Đã đổi mật khẩu. Các phiên khác bị đăng xuất."); }

      /* ===== KHỞI TẠO ===== */
      fillRoleSelects();
      window.addEventListener("hashchange", route);
      if (session) switchRole(role);
      if (!location.hash) location.hash = session ? "#/home" : "#/login"; else route();
    </script>
  </body>
</html>
