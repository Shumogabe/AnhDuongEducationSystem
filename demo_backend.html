      function saveNews(id, status) {
        const title = ($("nt_vi").value || "").trim();
        if (!fieldError($("nt_vi"), title ? "" : "Vui lòng nhập tiêu đề.")) return;
        if (id) {
          const n = NEWS.find((x) => x.id === id);

      function exportSubs() { const n = SUBS.filter((s) => s.active).length; audit(`Xuất danh sách bản tin (${n} email)`); toast(`Đã xuất ${n} email và ghi nhật ký (demo)`); }
      function pgCompose() {
        return `<div class="flex gap-3 items-start bg-blue-50 border border-blue-200 text-blue-800 rounded-xl p-3 text-xs"><i class="fa-solid fa-circle-info mt-0.5"></i><p>Giai đoạn 1: soạn nội dung tại đây, xuất danh sách email để gửi qua dịch vụ ngoài (Mailchimp, Brevo...). Chưa gửi trực tiếp từ hệ thống.</p></div>
          ${card("Soạn bản tin", `<div class="space-y-4">${bilingual("Tiêu đề", "bt", "", "")}${bilingual("Nội dung", "bb", "", "", { type: "textarea", rows: 6 })}</div>`, "")}
          <div class="flex flex-wrap justify-end gap-2">${btn("Lưu nháp", "saveDemo('bản tin')", "ghost")}${btn("Xuất danh sách người nhận", "exportSubs()", "primary", "fa-file-export")}</div>`;
      }
      function pgInbox() {
        return card("Hộp thư liên hệ", table(["Người gửi", "Cơ sở", "Nội dung", "Ngày", "Xử lý"], MSGS.map((m) => [`<strong>${e(m.name)}</strong><br><span class="text-gray-500">${e(m.phone)}</span>`, e(campLabel(m.campus)), e(m.text), fmtDate(m.date), m.done ? badge("Đã xử lý", "bg-green-100 text-brand-green") : btn("Đánh dấu đã xử lý", `doneMsg(${m.id})`, "ghost")]), "Chưa có tin nhắn."));
      }
      function doneMsg(id) { MSGS.find((m) => m.id === id).done = true; audit("Xử lý tin nhắn liên hệ #" + id); toast("Đã đánh dấu xử lý"); refresh(); }

      /* ===== HỆ THỐNG ===== */
      function pgUsers() {
        const rows = USERS.map((u) => [`<strong>${e(u.name)}</strong><br><span class="text-gray-500">${e(u.email)}</span>`, e(ROLES[u.role].label.split(" - ")[0]), e(campLabel(u.campus)), badge(u.locked ? "Đã khóa" : "Hoạt động", u.locked ? "bg-red-100 text-red-700" : "bg-green-100 text-brand-green"), `<div class="flex flex-wrap gap-1">${u.id === 1 ? "" : btn(u.locked ? "Mở khóa" : "Khóa", `toggleLock(${u.id})`, "ghost")}${btn("Đặt lại mật khẩu", `confirmAction('Gửi email đặt lại mật khẩu cho ${e(u.email)}?','resetPass(${u.id})')`, "ghost")}</div>`]);
        return `${card("Tài khoản quản trị", table(["Người dùng", "Vai trò", "Phạm vi", "Trạng thái", ""], rows), btn("Thêm tài khoản", "newUser()", "primary", "fa-user-plus"))}
          ${card("Quyền theo vai trò", `<p class="text-xs text-gray-600 leading-relaxed"><strong>Quản trị hệ thống:</strong> toàn bộ 4 cơ sở, nội dung chung, người dùng, cài đặt, nhật ký.<br><strong>Quản trị cơ sở:</strong> chỉ dữ liệu cơ sở được gán; xem (không sửa) nội dung chung; bài viết cần được duyệt trước khi xuất bản; không có Bản tin, Người dùng, Cài đặt, Nhật ký.</p>`)}`;
      }
      function resetPass(id) { const u = USERS.find((x) => x.id === id); audit("Đặt lại mật khẩu " + u.email); toast("Đã gửi email đặt lại mật khẩu"); }
      function toggleLock(id) { const u = USERS.find((x) => x.id === id); u.locked = !u.locked; audit(`${u.locked ? "Khóa" : "Mở khóa"} tài khoản ${u.name}`); toast(u.locked ? "Đã khóa tài khoản" : "Đã mở khóa"); refresh(); }
      function newUser() {
        openModal("Thêm tài khoản", `<form onsubmit="saveUser(event)" novalidate class="space-y-4">${field("Họ tên", "u-n", "", { required: true })}${field("Email", "u-e", "", { type: "email", required: true })}${field("Vai trò", "u-r", "campus", { type: "select", options: [["system", "Quản trị hệ thống"], ["campus", "Quản trị cơ sở"]] })}${field("Cơ sở được gán", "u-c", "phutho1", { type: "select", options: Object.entries(CAMP), hint: "Chỉ áp dụng cho Quản trị cơ sở" })}<div class="flex justify-end gap-2">${btn("Hủy", "closeModal()")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Tạo và gửi lời mời</button></div></form>`);
      }
      function saveUser(ev) {
        ev.preventDefault();
        const n = $("u-n"), em = $("u-e");
        const ok = fieldError(n, n.value.trim() ? "" : "Vui lòng nhập họ tên.") & fieldError(em, isEmail(em.value) ? (USERS.some((u) => u.email === em.value) ? "Email đã tồn tại." : "") : "Email chưa đúng định dạng.");
        if (!ok) return;
        const r = $("u-r").value;
        USERS.push({ id: Date.now(), name: n.value.trim(), email: em.value, role: r, campus: r === "campus" ? $("u-c").value : "", locked: false });
        audit(`Tạo tài khoản ${n.value.trim()}`);
        closeModal(); toast("Đã tạo tài khoản và gửi email mời"); refresh();
      }
      let setTab = "contact";
      function pgSettings() {
        const tabs = [["contact", "Liên hệ chung"], ["campus", "Liên hệ theo cơ sở"], ["portal", "Liên kết cổng"], ["menu", "Menu & Logo"], ["seo", "SEO & mạng xã hội"]];
        const panel = {
          contact: () => `<div class="grid md:grid-cols-2 gap-4">${field("Hotline", "s-h", "0965 284 866")}${field("Zalo", "s-z", "https://zalo.me/0965284866")}${field("Messenger", "s-m", "https://m.me/TruongMamnonAnhDuongVT")}${field("Email", "s-e", "tuyensinh@anhduongschool.edu.vn", { type: "email" })}</div>`,
          campus: () => `<div class="space-y-4">${Object.entries(CAMP).map(([k, v]) => `<div class="grid md:grid-cols-3 gap-3 items-end"><p class="text-xs font-bold">${v}</p>${field("Hotline", "sh-" + k, "")}${field("Email", "se-" + k, "", { type: "email" })}</div>`).join("")}</div>`,
          portal: () => `<div class="grid md:grid-cols-2 gap-4">${field("Địa chỉ App Phụ huynh", "p-a", "", { type: "url", ph: "https://...", hint: "Nút Đăng nhập App Sổ liên lạc trên website" })}${field("Địa chỉ Portal Giáo viên/BGH", "p-b", "", { type: "url", ph: "https://...", hint: "Nút Đăng nhập Portal cán bộ" })}</div><p class="text-xs text-gray-500 mt-3">SSO cho hai cổng này thuộc giai đoạn 2.</p>`,
          menu: () => `<div class="grid md:grid-cols-2 gap-4">${field("Logo", "mlogo", "", { type: "file" })}${field("Favicon", "mfav", "", { type: "file" })}</div><div class="mt-4 space-y-2">${["Trang Chủ", "Giới Thiệu", "Hệ Thống Cơ Sở", "Chương Trình Học", "Dinh Dưỡng", "Thông Tin"].map((m) => `<div class="grid grid-cols-2 gap-3">${field("Menu (VI)", "mv-" + m, m)}${field("Menu (EN)", "me-" + m, "")}</div>`).join("")}</div>`,
          seo: () => `<div class="space-y-4">${bilingual("Tiêu đề mặc định", "seot", "Hệ Thống Giáo Dục Mầm Non Ánh Dương", "")}${bilingual("Mô tả mặc định", "seod", "", "", { type: "textarea", rows: 2 })}${field("Ảnh chia sẻ mạng xã hội (Open Graph)", "seoi", "", { type: "file" })}</div>`,
        };
        return `<div class="flex gap-2 overflow-x-auto pb-1" role="tablist">${tabs.map((t) => `<button role="tab" aria-selected="${t[0] === setTab}" onclick="setTab='${t[0]}';refresh()" class="tab-btn ${t[0] === setTab ? "active" : ""}">${t[1]}</button>`).join("")}</div>${card(tabs.find((t) => t[0] === setTab)[1], panel[setTab]())}${saveBar(false, "cài đặt")}`;
      }
      let auditQ = "";
      function pgAudit() {
        const list = AUDIT.filter((a) => !auditQ || (a.user + " " + a.action).toLowerCase().includes(auditQ.toLowerCase()));
        return card("Ai sửa gì, lúc nào", `<div class="mb-4"><input id="audit-q" type="search" value="${e(auditQ)}" placeholder="Tìm theo người dùng hoặc hành động..." oninput="auditQ=this.value;refreshAudit()" class="fld sm:max-w-sm" aria-label="Tìm nhật ký" /></div><div id="audit-table">${table(["Thời gian", "Người dùng", "Hành động"], list.map((a) => [e(a.t), e(a.user), e(a.action)]), "Không có bản ghi.")}</div>`);
      }
      function refreshAudit() {
        const list = AUDIT.filter((a) => !auditQ || (a.user + " " + a.action).toLowerCase().includes(auditQ.toLowerCase()));
        $("audit-table").innerHTML = table(["Thời gian", "Người dùng", "Hành động"], list.map((a) => [e(a.t), e(a.user), e(a.action)]), "Không có bản ghi.");
      }

      /* ===== HỒ SƠ CÁ NHÂN ===== */
      function pgProfile() {
        const p = me();
        return `<div class="grid lg:grid-cols-2 gap-6">
          ${card("Thông tin tài khoản", `<form onsubmit="event.preventDefault();saveDemo('hồ sơ cá nhân')" class="space-y-4">${field("Họ tên", "pf-n", p.name)}${field("Vai trò", "pf-r", p.label, { ro: true })}${field("Số điện thoại", "pf-p", "")}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Lưu</button></form>`)}
          ${card("Đổi mật khẩu", `<form onsubmit="submitPass(event)" novalidate class="space-y-4">${field("Mật khẩu hiện tại", "pw0", "", { type: "password", required: true })}${field("Mật khẩu mới", "pw1", "", { type: "password", required: true, hint: "Tối thiểu 10 ký tự, gồm chữ hoa, chữ thường và số." })}${field("Nhập lại mật khẩu mới", "pw2", "", { type: "password", required: true })}<button class="tap px-5 rounded-full bg-brand-primary text-white text-xs font-semibold">Đổi mật khẩu</button></form>`)}
        </div>
        ${isSystem() ? card("Xác thực hai bước (đề xuất cho Quản trị hệ thống)", `<label class="flex items-center gap-3 text-xs"><input type="checkbox" class="w-5 h-5 accent-[#8E2424]" onchange="toast(this.checked?'Đã bật xác thực hai bước (demo)':'Đã tắt xác thực hai bước (demo)')" />Bật xác thực hai bước bằng ứng dụng Authenticator</label>`) : ""}`;
      }
      function submitPass(ev) {
        ev.preventDefault();
        const a = $("pw0"), b = $("pw1"), c = $("pw2");
        const strong = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{10,}$/.test(b.value);
        const ok = fieldError(a, a.value ? "" : "Vui lòng nhập mật khẩu hiện tại.") & fieldError(b, strong ? "" : "Mật khẩu chưa đủ mạnh.") & fieldError(c, c.value === b.value ? "" : "Mật khẩu nhập lại không khớp.");
        if (!ok) return;
        ev.target.reset();
        audit("Đổi mật khẩu");
        toast("Đã đổi mật khẩu. Các phiên khác sẽ bị đăng xuất.");
      }

      /* ===== KHỞI TẠO ===== */
      window.addEventListener("hashchange", route);
      switchRole("system");
      if (!location.hash) location.hash = session ? "#/dashboard" : "#/login";
    </script>
  </body>
</html>
